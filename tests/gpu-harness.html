<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FANGS GPU harness</title>
</head>
<body>
<pre id="log">running…</pre>
<script type="module">
/*
 * Browser-side harness for tests/gpu-e2e.mjs: fits the built-in models with
 * the blocked sampler on both the WebGPU and CPU backends and publishes
 * posterior summaries on window.__gpuResult. Can also be opened by hand
 * (npx serve . → /tests/gpu-harness.html) to try a real GPU.
 *
 * Query parameters:
 *   ?samples=2000&burnin=500&chains=2   sampler settings
 *   ?models=mixed,poisson               only these models
 *   ?bench=1                            also time a large simulated GLMM
 */
import { Lexer } from '../src/parser/lexer.js';
import { Parser } from '../src/parser/parser.js';
import { ModelGraph } from '../src/parser/model-graph.js';
import { parseCSV, prepareDataColumns } from '../src/data/csv-loader.js';
import * as D from '../src/data/default-data.js';
import { compileBlockedModel } from '../src/samplers/blocked/compile-model.js';
import { runBlocked } from '../src/samplers/blocked/blocked-sampler.js';
import { webgpuAvailable } from '../src/samplers/blocked/gpu-backend.js';

const qs = new URLSearchParams(location.search);
const nSamples = +(qs.get('samples') ?? 2000);
const burnin = +(qs.get('burnin') ?? 500);
const nChains = +(qs.get('chains') ?? 2);
const logEl = document.getElementById('log');
const log = (s) => { logEl.textContent += '\n' + s; console.log(s); };

const POISSON_GLMM = `model {
  for (i in 1:N) {
    y_count[i] ~ dpois(lambda[i])
    log(lambda[i]) <- alpha + beta * x[i] + b[group[i]]
  }
  for (j in 1:J) { b[j] ~ dnorm(0, sigma.b) }
  alpha ~ dnorm(0, 5)
  beta ~ dnorm(0, 5)
  sigma.b ~ dexp(1)
}`;
const LOGISTIC_GLMM = POISSON_GLMM
  .replace('y_count[i] ~ dpois(lambda[i])', 'y_bin[i] ~ dbern(p[i])')
  .replace('log(lambda[i])', 'logit(p[i])');

const MODELS = {
  linear: D.defaultModel1,
  mixed: D.defaultModel2,
  poisson: D.defaultModel3,
  logistic: D.defaultModel4,
  randomSlopes: D.defaultModel5,
  poissonGlmm: POISSON_GLMM,
  logisticGlmm: LOGISTIC_GLMM,
};

function buildGraph(src, columns, N, J) {
  const ast = new Parser(new Lexer(src).tokenize()).parse();
  const g = new ModelGraph(ast, { columns, N, J });
  g.build();
  return g;
}

function summarise(samples) {
  const out = {};
  for (const [name, chains] of Object.entries(samples)) {
    const v = chains.flat();
    const m = v.reduce((a, b) => a + b, 0) / v.length;
    const sd = Math.sqrt(v.reduce((a, b) => a + (b - m) ** 2, 0) / (v.length - 1));
    const chainMeans = chains.map(c => c.reduce((a, b) => a + b, 0) / c.length);
    out[name] = { mean: m, sd, chainMeans };
  }
  return out;
}

async function main() {
  const result = { webgpu: webgpuAvailable(), models: {}, errors: [] };
  if (!result.webgpu) { window.__gpuResult = result; log('WebGPU unavailable'); return; }
  const adapter = await navigator.gpu.requestAdapter();
  result.adapter = adapter?.info ? { vendor: adapter.info.vendor, architecture: adapter.info.architecture } : null;

  const rows = parseCSV(D.defaultCSV);
  const { columns } = prepareDataColumns(rows);
  const J = new Set(Array.from(columns.group)).size;

  const only = qs.get('models')?.split(',');
  for (const [name, src] of Object.entries(MODELS)) {
    if (only && !only.includes(name)) continue;
    try {
      const g = buildGraph(src, columns, rows.length, J);
      const plan = compileBlockedModel(g);
      const settings = { nChains, nSamples, burnin, plan };
      let t = performance.now();
      const gpu = await runBlocked(g, { ...settings, backend: 'gpu' });
      const gpuMs = performance.now() - t;
      t = performance.now();
      const cpu = await runBlocked(g, { ...settings, backend: 'cpu' });
      const cpuMs = performance.now() - t;
      result.models[name] = { gpu: summarise(gpu), cpu: summarise(cpu), gpuMs, cpuMs };
      log(`${name}: gpu ${gpuMs.toFixed(0)} ms, cpu ${cpuMs.toFixed(0)} ms`);
    } catch (err) {
      result.errors.push(`${name}: ${err.message}`);
      log(`${name}: ERROR ${err.message}`);
    }
  }

  if (qs.get('bench')) result.bench = await bench();
  window.__gpuResult = result;
  log('done');
}

/** Time both backends on a simulated Poisson GLMM with many groups. */
async function bench() {
  const N = +(qs.get('benchN') ?? 200000);
  const J = +(qs.get('benchJ') ?? 5000);
  const iters = +(qs.get('benchIters') ?? 50);
  const x = new Float64Array(N);
  const group = new Float64Array(N);
  const y = new Float64Array(N);
  const bTrue = Array.from({ length: J }, () => 0.5 * gauss());
  for (let i = 0; i < N; i++) {
    x[i] = gauss();
    group[i] = 1 + (i % J);
    const lambda = Math.exp(0.5 + 0.3 * x[i] + bTrue[group[i] - 1]);
    y[i] = poisson(lambda);
  }
  const g = buildGraph(POISSON_GLMM.replaceAll('y_count', 'y'), { x, group, y }, N, J);
  const plan = compileBlockedModel(g);
  const out = { N, J, iters };
  for (const backend of ['gpu', 'cpu']) {
    const t = performance.now();
    const s = await runBlocked(g, { nChains: 1, nSamples: iters, burnin: 0, plan, backend });
    out[`${backend}MsPerIter`] = (performance.now() - t) / iters;
    out[`${backend}Beta`] = s.beta[0].at(-1);
  }
  log(`bench N=${N} J=${J}: gpu ${out.gpuMsPerIter.toFixed(1)} ms/iter, cpu ${out.cpuMsPerIter.toFixed(1)} ms/iter`);
  return out;
}

function gauss() {
  return Math.sqrt(-2 * Math.log(Math.random() || 1e-300)) * Math.cos(2 * Math.PI * Math.random());
}

function poisson(lambda) {
  let k = 0;
  let p = Math.exp(-lambda);
  let s = p;
  const u = Math.random();
  while (u > s && k < 1000) { k++; p *= lambda / k; s += p; }
  return k;
}

main().catch(err => { window.__gpuResult = { fatal: err.message }; log('FATAL ' + err.stack); });
</script>
</body>
</html>
